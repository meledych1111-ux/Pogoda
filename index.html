<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Погода и одежда</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <!-- PWA: манифест и поддержка iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Погода">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="weather-app">
    <header class="app-header">
      <h1>Погода в Севастополе</h1>
      <div id="weather"></div>
    </header>

    <main class="app-content">
      <div id="advice"></div>

      <h2>Оцените совет</h2>
      <div class="btn-group">
        <button id="adviceGood">Совет подошёл</button>
        <button id="adviceBad">Не подошёл</button>
      </div>

      <h2>Что вы надели?</h2>
      <input type="text" id="wornInput" placeholder="Например: куртка и джинсы">

      <h2>Оцените свой выбор</h2>
      <div class="btn-group">
        <button class="choiceBtn" data-feedback="Подошло">✅</button>
        <button class="choiceBtn" data-feedback="Холодно">🥶</button>
        <button class="choiceBtn" data-feedback="Жарко">🥵</button>
      </div>

      <button id="saveBtn">Сохранить</button>

      <h2>История</h2>
      <div id="history"></div>

      <h2>Статистика</h2>
      <div id="stats"></div>
      <div class="stats-footer">
  <button id="clearBtn" onclick="clearHistory()">🧹 Очистить историю</button>
</div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
